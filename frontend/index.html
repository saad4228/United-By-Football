<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Crests and competition logos come from ESPN's CDN: open the connection early. -->
    <link rel="preconnect" href="https://a.espncdn.com" />
    <link rel="dns-prefetch" href="https://a.espncdn.com" />
    <meta name="theme-color" content="#000000" />
    <meta name="author" content="Mohammad Saad" />
    <meta
      name="description"
      content="United By Football — live and upcoming football matches, and the viewing sources available for each, in one clean place."
    />
    <title>United By Football — Never Miss the Kickoff</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("ubf-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
